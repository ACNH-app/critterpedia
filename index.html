<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모동숲 생물도감</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <section class="hero-copy">
          <p class="eyebrow">Animal Crossing: New Horizons</p>
          <h1>모동숲 생물도감</h1>
          <p class="hero-text">
            `nookipedia-api`의 생물 데이터를 정적 스냅샷으로 가져와 GitHub Pages에서 바로 배포할 수 있게 만든
            독립형 도감입니다. 잡은 생물과 박물관 기증 상태는 브라우저에만 저장됩니다.
          </p>

          <div class="hero-meta">
            <div>
              <p>현재 기준</p>
              <strong id="heroNowText">-</strong>
            </div>
            <span id="heroMetaText">데이터 로딩 중...</span>
          </div>

          <div id="summaryGrid" class="summary-grid hero-summary-grid"></div>
        </section>
      </header>

      <main class="layout">

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>필터</h2>
              <p class="panel-subtext">생물 종류, 반구, 검색어, 현재 출현 여부로 빠르게 좁힐 수 있습니다.</p>
            </div>
          </div>
          <div class="tab-row" id="typeTabs">
            <button type="button" class="tab-button active" data-type="bugs">곤충</button>
            <button type="button" class="tab-button" data-type="fish">물고기</button>
            <button type="button" class="tab-button" data-type="sea">해산물</button>
          </div>
          <div class="controls-grid">
            <label class="field">
              <span>검색</span>
              <input id="searchInput" type="search" placeholder="한글/영문 이름 검색" />
            </label>
            <label class="field">
              <span>반구</span>
              <select id="hemisphereSelect">
                <option value="north">북반구</option>
                <option value="south">남반구</option>
              </select>
            </label>
            <label class="field">
              <span>정렬</span>
              <select id="sortSelect">
                <option value="number">번호순</option>
                <option value="nameKo">이름순</option>
                <option value="sellPrice">판매가순</option>
              </select>
            </label>
            <label class="field">
              <span>보유 상태</span>
              <select id="ownedFilterSelect">
                <option value="">전체</option>
                <option value="owned">잡은 것만</option>
                <option value="unowned">미획득만</option>
              </select>
            </label>
            <label class="field">
              <span>기증 상태</span>
              <select id="donatedFilterSelect">
                <option value="">전체</option>
                <option value="donated">기증한 것만</option>
                <option value="undonated">미기증만</option>
              </select>
            </label>
          </div>
          <div class="inline-options">
            <label class="inline-check">
              <input id="currentOnlyCheckbox" type="checkbox" />
              지금 출현하는 생물만 보기
            </label>
          </div>
          <div id="activeFilters" class="active-filters"></div>
        </section>

        <section class="panel">
          <div class="panel-head panel-head-spread">
            <div>
              <h2>생물 목록</h2>
              <p id="listMeta" class="panel-subtext">-</p>
            </div>
          </div>
          <div id="critterGrid" class="critter-grid"></div>
        </section>
      </main>
    </div>

    <div id="detailBackdrop" class="detail-backdrop hidden"></div>
    <aside id="detailPanel" class="detail-panel hidden" aria-hidden="true">
      <button id="closeDetailButton" type="button" class="detail-close">닫기</button>
      <div id="detailContent"></div>
    </aside>

    <script type="module" src="./app.js"></script>
  </body>
</html>
